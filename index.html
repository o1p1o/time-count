```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Калькулятор времени</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;
      color: #1c1c1e;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    h1 {
      margin: 0 0 32px;
      text-align: center;
      font-size: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 16px;
      background: white;
      padding: 0 16px;
      font-size: 22px;
      outline: none;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
    }

    #operations {
      margin-top: 24px;
    }

    #operationsInput {
      font-size: 21px;
    }

    .calculate {
      width: 100%;
      height: 60px;
      margin-top: 24px;
      border: none;
      border-radius: 17px;
      background: #007aff;
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      min-height: 20px;
      margin-top: 12px;
      color: #ff3b30;
      font-size: 14px;
      text-align: center;
    }

    .result {
      margin-top: 12px;
      padding: 24px;
      border-radius: 20px;
      background: white;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .result-label {
      margin-bottom: 6px;
      color: #8e8e93;
      font-size: 14px;
    }

    .result-time {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>Калькулятор времени для Вики 🐥</h1>

    <label for="start">Старт</label>

    <input
      id="start"
      type="time"
      value="09:30"
    >


    <div id="operations">

      <label for="operationsInput">Операции</label>

      <input
        id="operationsInput"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="+1.00 -0.30 +2.20"
      >

    </div>


    <button class="calculate" onclick="calculate()">
      Равно
    </button>


    <div id="error" class="error"></div>


    <div class="result">

      <div class="result-label">
        Результат
      </div>

      <div id="result" class="result-time">
        09:30
      </div>

    </div>

  </main>


  <script>

    function parseDuration(value) {

      value = value.trim();

      if (!value) {
        return null;
      }

      const parts = value.split(".");

      if (parts.length > 2) {
        return null;
      }

      const hours = Number(parts[0]);

      if (!Number.isInteger(hours) || hours < 0) {
        return null;
      }

      let minutes = 0;

      if (parts.length === 2) {

        const minutePart = parts[1];

        if (
          minutePart.length === 0 ||
          minutePart.length > 2 ||
          !/^\d+$/.test(minutePart)
        ) {
          return null;
        }

        minutes = Number(minutePart);

      }

      if (minutes >= 60) {
        return null;
      }

      return hours * 60 + minutes;
    }


    function calculate() {

      const error = document.getElementById("error");
      const result = document.getElementById("result");

      error.textContent = "";


      // Получаем стартовое время

      const start = document.getElementById("start").value;

      if (!start) {
        error.textContent = "Укажи стартовое время";
        return;
      }

      const [startHours, startMinutes] =
        start.split(":").map(Number);


      let totalMinutes =
        startHours * 60 + startMinutes;


      // Получаем строку операций

      let expression =
        document.getElementById("operationsInput").value.trim();


      if (!expression) {
        result.textContent = formatTime(totalMinutes);
        return;
      }


      // Убираем пробелы

      expression = expression.replace(/\s+/g, "");


      // Каждая операция должна начинаться с + или -

      if (!/^[+-]/.test(expression)) {
        error.textContent =
          "Операции должны начинаться с + или −";
        return;
      }


      // Разбиваем строку на операции

      const operations =
        expression.match(/[+-][^+-]+/g);


      if (!operations) {
        error.textContent = "Проверь запись операций";
        return;
      }


      // Проверяем, что вся строка была разобрана

      const reconstructed =
        operations.join("");

      if (reconstructed !== expression) {
        error.textContent = "Проверь запись операций";
        return;
      }


      // Выполняем операции по очереди

      for (const operation of operations) {

        const sign = operation[0];

        const value = operation.slice(1);

        const duration = parseDuration(value);


        if (duration === null) {
          error.textContent =
            `Некорректное значение: ${value}`;
          return;
        }


        if (sign === "+") {
          totalMinutes += duration;
        } else {
          totalMinutes -= duration;
        }
      }


      // Зацикливаем время в пределах суток

      totalMinutes =
        ((totalMinutes % 1440) + 1440) % 1440;


      result.textContent =
        formatTime(totalMinutes);
    }


    function formatTime(totalMinutes) {

      const hours =
        Math.floor(totalMinutes / 60);

      const minutes =
        totalMinutes % 60;


      return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0")
      );
    }


    // Можно нажать Enter вместо кнопки «Равно»

    document
      .getElementById("operationsInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          calculate();
        }

      });

  </script>

</body>
</html>
